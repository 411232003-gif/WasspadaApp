<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Radial Selector</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="code-with-nazia.css" />
</head>
<body>
  <div class="selector">
    <div class="knob"></div>
    <ul>
      <li style="--i: 0"><input type="radio" name="choice" aria-label="Home" checked /></li>
      <li style="--i: 1"><input type="radio" name="choice" aria-label="Search" /></li>
      <li style="--i: 2"><input type="radio" name="choice" aria-label="Star" /></li>
      <li style="--i: 3"><input type="radio" name="choice" aria-label="More" /></li>
      <li style="--i: 4"><input type="radio" name="choice" aria-label="Refresh" /></li>
      <li style="--i: 5"><input type="radio" name="choice" aria-label="Back" /></li>
    </ul>
  </div>
  <script>
    const selector = document.querySelector(".selector");
const knob = selector.querySelector(".knob");
const items = selector.querySelectorAll("li");

// Highlight item number `index` and turn the knob to it
function select(index) {
  selector.style.setProperty("--turn", index * 60);
  items.forEach((li, i) => li.classList.toggle("selected", i === index));
}

// Click the knob: open / close (closing resets to the first item)
knob.addEventListener("click", () => {
  const isOpen = selector.classList.toggle("open");
  if (!isOpen) select(0);
});

// Click an icon: select it
items.forEach((li, i) => {
  li.querySelector("input").addEventListener("change", () => select(i));
});

select(0);
  </script>
</body>
</html>
